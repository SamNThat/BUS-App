<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MediCare{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sage:       #4a7c6f;
      --sage-light: #6a9e8f;
      --sage-pale:  #e8f2ef;
      --cream:      #faf8f3;
      --warm-white: #ffffff;
      --ink:        #1e2a24;
      --ink-soft:   #4a5a52;
      --ink-muted:  #8a9e94;
      --amber:      #d4813a;
      --amber-pale: #fdf3e8;
      --rose:       #c0544e;
      --rose-pale:  #fdecea;
      --border:     #d8e6e0;
      --shadow-sm:  0 1px 3px rgba(30,42,36,.07);
      --shadow-md:  0 4px 16px rgba(30,42,36,.10);
      --shadow-lg:  0 8px 32px rgba(30,42,36,.13);
      --r:          14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Nav ── */
    nav {
      background: var(--warm-white);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .nav-brand {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      color: var(--sage);
      letter-spacing: -.01em;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .nav-brand .dot { color: var(--amber); }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .nav-badge {
      background: var(--sage-pale);
      color: var(--sage);
      font-size: .75rem;
      font-weight: 600;
      padding: .25rem .75rem;
      border-radius: 20px;
      letter-spacing: .03em;
      text-transform: uppercase;
    }
    .btn-logout {
      font-family: 'DM Sans', sans-serif;
      font-size: .85rem;
      color: var(--ink-soft);
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .4rem 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: all .15s;
    }
    .btn-logout:hover { background: var(--sage-pale); border-color: var(--sage-light); color: var(--sage); }

    /* ── Layout ── */
    .page { max-width: 960px; margin: 0 auto; padding: 2.5rem 1.5rem; }
    .page-header { margin-bottom: 2rem; }
    .page-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      color: var(--ink);
      line-height: 1.2;
    }
    .page-header p { color: var(--ink-soft); margin-top: .35rem; font-size: .95rem; }

    /* ── Cards ── */
    .card {
      background: var(--warm-white);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    .card-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.1rem;
      color: var(--ink);
      margin-bottom: 1rem;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }

    /* ── Stat blocks ── */
    .stat { text-align: center; padding: 1.25rem; }
    .stat-val {
      font-family: 'DM Serif Display', serif;
      font-size: 2.2rem;
      color: var(--sage);
      line-height: 1;
    }
    .stat-label { font-size: .8rem; color: var(--ink-muted); margin-top: .4rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }

    /* ── Dose status badges ── */
    .badge {
      display: inline-flex; align-items: center; gap: .35rem;
      font-size: .8rem; font-weight: 600; border-radius: 20px;
      padding: .3rem .85rem; letter-spacing: .02em;
    }
    .badge-due      { background: var(--amber-pale); color: var(--amber); }
    .badge-past     { background: var(--rose-pale);  color: var(--rose); }
    .badge-upcoming { background: var(--sage-pale);  color: var(--sage); }
    .badge-taken    { background: #eaf4ea;            color: #3a7a3a; }

    /* ── Notification banner ── */
    .notif-banner {
      background: var(--amber-pale);
      border: 1px solid #f0c080;
      border-radius: var(--r);
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      animation: slideDown .3s ease;
    }
    .notif-icon { font-size: 1.8rem; flex-shrink: 0; }
    .notif-text h3 { font-size: 1rem; color: var(--amber); font-weight: 600; }
    .notif-text p  { font-size: .88rem; color: var(--ink-soft); margin-top: .15rem; }

    /* ── Buttons ── */
    .btn {
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem; font-weight: 500;
      border: none; border-radius: 10px;
      padding: .65rem 1.4rem;
      cursor: pointer;
      transition: all .15s;
      display: inline-flex; align-items: center; gap: .5rem;
    }
    .btn-primary   { background: var(--sage); color: #fff; }
    .btn-primary:hover { background: var(--sage-light); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-ghost  { background: var(--sage-pale); color: var(--sage); }
    .btn-ghost:hover { background: #d4ece5; }

    /* ── Dose row ── */
    .dose-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: .9rem 0;
      border-bottom: 1px solid var(--border);
    }
    .dose-row:last-child { border-bottom: none; }
    .dose-meta { display: flex; flex-direction: column; gap: .1rem; }
    .dose-time { font-size: 1.1rem; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
    .dose-window { font-size: .78rem; color: var(--ink-muted); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 2rem; right: 2rem;
      background: var(--ink); color: #fff;
      padding: .85rem 1.4rem; border-radius: 12px;
      font-size: .88rem; font-weight: 500;
      box-shadow: var(--shadow-lg);
      opacity: 0; transform: translateY(8px);
      transition: all .25s; pointer-events: none; z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* ── Misc ── */
    .section-gap { margin-top: 1.5rem; }
    .text-muted   { color: var(--ink-muted); font-size: .88rem; }
    .empty-state  { text-align: center; padding: 2rem; color: var(--ink-muted); font-size: .9rem; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .page { padding: 1.5rem 1rem; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">💊 MediCare<span class="dot">.</span></div>
  <div class="nav-right">
    {% if session.get('role') %}
      <span class="nav-badge">{{ session.get('role') }}</span>
      <a href="/logout" class="btn-logout">Sign out</a>
    {% endif %}
  </div>
</nav>

{% block content %}{% endblock %}

<div id="toast"></div>

<script>
function showToast(msg, duration=3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
