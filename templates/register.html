{% extends "base.html" %}

{% block title %}Register - MediTrack{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto;">
    <h2>Create New Account</h2>

    {% if error %}
    <div class="alert" style="background-color: #f8d7da; border-color: #f5c6cb; color: #721c24;">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">
        <div style="margin-bottom: 1.5rem;">
            <label for="account_type" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Account Type:</label>
            <select id="account_type" name="account_type" required style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.95rem;">
                <option value="">-- Select --</option>
                <option value="patient">Patient</option>
                <option value="carer">Carer</option>
            </select>
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label for="full_name" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Full Name:</label>
            <input type="text" id="full_name" name="full_name" required style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.95rem;">
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label for="age" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Age:</label>
            <input type="number" id="age" name="age" required style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.95rem;">
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label for="username" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Username:</label>
            <input type="text" id="username" name="username" required style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.95rem;">
        </div>

        <div style="margin-bottom: 2rem;">
            <label for="password" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Password:</label>
            <input type="password" id="password" name="password" required style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.95rem;">
        </div>

        <button type="submit" class="button" style="width: 100%; padding: 0.8rem; font-size: 1rem;">Create Account</button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center;">
        <p>Already have an account? <a href="/login" style="color: #2c5f7c; text-decoration: none; font-weight: 600;">Login here</a></p>
    </div>
</div>
{% endblock %}
