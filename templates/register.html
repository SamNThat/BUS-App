{% extends "base.html" %}

{% block title %}Register - MediTrack{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 2rem auto; padding: 2rem;">
    <h2 style="text-align: center; color: #2c5f7c;">Create New Account</h2>

    {% if error %}
    <div class="alert" style="background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 1.5rem;">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">
        <div style="margin-bottom: 1.5rem;">
            <label for="account_type" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">I am registering a:</label>
            <select id="account_type" name="account_type" required onchange="toggleFields()" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px;">
                <option value="" disabled selected>-- Select Role --</option>
                <option value="patient">Patient</option>
                <option value="family">Family Member</option>
            </select>
        </div>

        <div style="background: #f9f9f9; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem;">
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Full Name:</label>
                <input type="text" name="full_name" required style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px;">
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 1rem;">
                <div style="flex: 1;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Username:</label>
                    <input type="text" name="username" required style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="flex: 1;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Password:</label>
                    <input type="password" name="password" required style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px;">
                </div>
            </div>
        </div>

        <div id="patient_fields" style="display: none; border: 1px solid #cce5ff; background: #eef9ff; padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem;">
            <h4 style="margin-top: 0; color: #004085;">Patient & Medication Setup</h4>

            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Age:</label>
                <input type="number" name="age" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px;">
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 1rem;">
                <div style="flex: 2;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Medication Name:</label>
                    <input type="text" name="med_name" placeholder="e.g. Aricept" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="flex: 1;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Dose (mg):</label>
                    <input type="number" name="dose_mg" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px;">
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 1rem;">
                <div style="flex: 1;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Stock Count:</label>
                    <input type="number" name="stock_count" value="30" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="flex: 1;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Doses per Day:</label>
                    <input type="number" name="doses_per_day" value="1" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px;">
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Start Hour (0-23):</label>
                    <input type="number" name="first_dose_hour" value="8" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="flex: 1;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Hours Between:</label>
                    <input type="number" name="hours_between" value="4" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px;">
                </div>
            </div>
            <input type="hidden" name="window_hours" value="2">
        </div>

        <div id="family_fields" style="display: none; border: 1px solid #d4edda; background: #f1f8f3; padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem;">
            <h4 style="margin-top: 0; color: #155724;">Link to Patient</h4>
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Which patient are you monitoring?</label>
            <select name="linked_patient" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px;">
                {% for p in patients %}
                <option value="{{ p.name }}">{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="button" style="width: 100%; padding: 1rem; background-color: #2c5f7c; color: white; border: none; border-radius: 4px; font-size: 1.1rem; cursor: pointer;">
            Complete Registration
        </button>
    </form>
</div>

<script>
function toggleFields() {
    const type = document.getElementById('account_type').value;
    const patientFields = document.getElementById('patient_fields');
    const familyFields = document.getElementById('family_fields');

    if (type === 'patient') {
        patientFields.style.display = 'block';
        familyFields.style.display = 'none';
        // Make patient-only inputs required if needed
    } else if (type === 'family') {
        patientFields.style.display = 'none';
        familyFields.style.display = 'block';
    }
}
</script>
{% endblock %}
