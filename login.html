<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCare — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sage: #4a7c6f; --sage-light: #6a9e8f; --sage-pale: #e8f2ef;
      --cream: #faf8f3; --ink: #1e2a24; --ink-soft: #4a5a52; --ink-muted: #8a9e94;
      --amber: #d4813a; --border: #d8e6e0; --shadow-md: 0 4px 16px rgba(30,42,36,.10);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    /* Subtle background texture */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 30%, rgba(74,124,111,.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 80% 70%, rgba(212,129,58,.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-wrap {
      width: 100%; max-width: 420px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-md);
      position: relative;
    }

    .login-logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.8rem;
      color: var(--sage);
      text-align: center;
      margin-bottom: .25rem;
    }
    .login-logo .dot { color: var(--amber); }
    .login-tagline { text-align: center; color: var(--ink-muted); font-size: .88rem; margin-bottom: 2rem; }

    label {
      display: block;
      font-size: .82rem; font-weight: 600;
      color: var(--ink-soft);
      text-transform: uppercase; letter-spacing: .06em;
      margin-bottom: .4rem; margin-top: 1.1rem;
    }
    input {
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      background: var(--cream);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: .7rem 1rem;
      outline: none;
      color: var(--ink);
      transition: border-color .15s;
    }
    input:focus { border-color: var(--sage-light); background: #fff; }
    input[type="password"] { letter-spacing: .25em; }

    .error {
      background: #fdecea; border: 1px solid #f0b0ac;
      border-radius: 10px; padding: .75rem 1rem;
      font-size: .88rem; color: #b54040;
      margin-top: 1rem;
    }

    .btn-login {
      width: 100%; margin-top: 1.5rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem; font-weight: 600;
      background: var(--sage); color: #fff;
      border: none; border-radius: 12px;
      padding: .85rem;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .btn-login:hover { background: var(--sage-light); transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }

    .hint-box {
      margin-top: 1.75rem;
      background: var(--sage-pale);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      font-size: .8rem;
      color: var(--ink-soft);
      line-height: 1.7;
    }
    .hint-box strong { color: var(--sage); }
    .hint-title { font-weight: 600; font-size: .82rem; color: var(--sage); margin-bottom: .4rem; text-transform: uppercase; letter-spacing: .05em; }
    .hint-row { display: flex; justify-content: space-between; }
    .hint-row .pin { font-family: monospace; background: #fff; padding: .1rem .4rem; border-radius: 4px; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">💊 MediCare<span class="dot">.</span></div>
    <p class="login-tagline">Medication management &amp; reminders</p>

    <form method="POST" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" placeholder="e.g. patient" required>

      <label for="pin">PIN</label>
      <input type="password" id="pin" name="pin" autocomplete="current-password" maxlength="8" placeholder="••••" required>

      {% if error %}
        <div class="error">⚠ {{ error }}</div>
      {% endif %}

      <button type="submit" class="btn-login">Sign in →</button>
    </form>

    <div class="hint-box">
      <div class="hint-title">Demo credentials</div>
      <div class="hint-row"><span>patient</span><span class="pin">1234</span></div>
      <div class="hint-row"><span>carer</span><span class="pin">5678</span></div>
      <div class="hint-row"><span>james <em>(family)</em></span><span class="pin">0000</span></div>
    </div>
  </div>
</body>
</html>
